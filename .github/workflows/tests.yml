name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-tests.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-tests.txt

      - name: Install AstrBot runtime
        run: python -m pip install "AstrBot==4.28.1"

      - name: Run pytest
        run: |
          set -o pipefail
          python -m pytest -ra 2>&1 | tee pytest.log

      - name: Guard against silent all-skip
        if: always()
        run: |
          tail -n 20 pytest.log || true
          if ! grep -Eq '[0-9]+ passed' pytest.log; then
            echo "::error::0 tests passed — 套件疑似整体 skip，拒绝假绿。"
            exit 1
          fi