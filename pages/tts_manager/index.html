<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTS 音色管理</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- 背景图层：仅在配置了背景图时由 JS 注入图片 + 透明度/模糊度；默认仅显示主题底色 -->
    <div id="page-bg"><div id="page-bg-img"></div></div>
    <div id="app">
        <!-- 加载中 -->
        <div v-if="loading" class="loading">加载供应商配置中...</div>

        <!-- 加载完成：整体淡入。放在 template 内浏览器不会预渲染，
             避免 Vue 挂载前 mustache 表达式（如音量百分比）闪现 -->
        <template v-else>
            <!-- 全局音量条传送到 body：fixed 定位 + z-index(1001) 高于模态遮罩(999)，
                 试听/预览时无需关闭模态框即可调音量。
                 必须传送：.page-content 的淡入动画（fill-mode: both）会留下合成层，
                 层即层叠上下文，会把条内的 z-index 锁死在 #app 子树里压不过遮罩 -->
            <Teleport to="body">
                <div class="global-volume-bar">
                    <span class="global-volume-icon">🔊</span>
                    <input
                        type="range"
                        min="0"
                        max="1"
                        step="0.01"
                        v-model="volume"
                        class="global-volume-slider"
                        title="全局音量"
                    />
                    <span class="global-volume-value">{{ Math.round(volume * 100) }}%</span>
                </div>
            </Teleport>

            <div class="page-content">
                <h1>TTS 音色管理</h1>

                <div class="content-panel">
                    <!-- 有可见（已注册前端组件）供应商时显示 Tabs -->
                    <div class="tabs" v-if="visibleGroups.length">
                        <!-- 滑动高亮条：由 JS 对齐激活标签，切换时平滑平移 -->
                        <div class="tab-indicator"></div>
                        <button
                            v-for="group in visibleGroups"
                            :key="group.template_key"
                            class="tab"
                            :data-label="getDisplayName(group.template_key)"
                            :class="{ active: currentTab === group.template_key }"
                            @click="switchTab(group.template_key)"
                        >
                            {{ getDisplayName(group.template_key) }}
                        </button>
                    </div>

                    <!-- 无可见供应商时显示提示：区分「完全没配置」与「配置了但暂无可视化面板」 -->
                    <div v-else class="empty-state" style="padding: 20px; color: var(--gray);">
                        <template v-if="groups.length">
                            ⚠️ 已配置 {{ groups.length }} 个供应商（{{ groups.map(g => getDisplayName(g.template_key)).join('、') }}），但当前版本暂未提供其可视化面板。
                            如需在此面板内管理，请配置支持前端操作的服务商（如百炼 / MiniMax）；
                            Gemini 的语音设计 / 复刻请前往
                            <a href="https://aistudio.google.com/generate-speech" target="_blank" rel="noopener">Google AI Studio</a> 操作。
                        </template>
                        <template v-else>
                            ⚠️ 暂无 TTS 供应商配置，请在插件配置中添加 providers 条目。
                        </template>
                    </div>

                    <!-- 内容区域（有可见供应商时渲染组件） -->
                    <div class="tab-content" v-if="visibleGroups.length">
                        <!-- :key 随标签重挂载，切换动画随每次切换重播 -->
                        <div class="tab-pane" :key="currentTab">
                            <component
                                :is="currentComponent"
                                :entries="currentEntries"
                                :bridge="bridge"
                                :template-key="currentTab"
                            />
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </div>
    <script src="./static/vue.global.prod.js"></script>
    <script type="module" src="./app.js"></script>
</body>
</html>
