<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTS 音色管理</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="app">
        <h1>TTS 音色管理</h1>
        <div class="tabs" v-if="groups.length">
            <button 
                v-for="group in groups" 
                :key="group.template_key"
                class="tab"
                :class="{ active: currentTab === group.template_key }"
                @click="switchTab(group.template_key)"
            >
                {{ getDisplayName(group.template_key) }}
            </button>
        </div>
        <div v-else class="loading">加载供应商配置中...</div>
        <div class="tab-content">
            <component 
                :is="currentComponent" 
                :entries="currentEntries"
                :bridge="bridge"
                :template-key="currentTab"
            />
        </div>
    </div>
    <script src="./static/vue.global.prod.js"></script>
    <script type="module" src="./app.js"></script>
</body>
</html>
